<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Fase 4</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #e0f7fa; margin: 0; padding: 20px; text-align: center; }
        .panel { background: white; max-width: 900px; margin: 20px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #00796b; color: white; cursor: pointer; border: none; font-weight: bold; }
        
        #juego { display: none; }
        .jugador-card { display: inline-block; padding: 10px; margin: 5px; border-radius: 8px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black;}
        
        /* Nuevos estilos de las tarjetas de propiedad */
        #tablero { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; gap: 8px; }
        .casilla { width: 80px; height: 110px; background: white; border: 2px solid #333; display: flex; flex-direction: column; position: relative; border-radius: 4px; overflow: hidden; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
        .color-bar { height: 25px; width: 100%; border-bottom: 2px solid #333; }
        .nombre { padding: 5px 2px; font-size: 11px; font-weight: bold; flex-grow: 1; display: flex; align-items: center; justify-content: center; line-height: 1.1; }
        .precio { padding: 4px; font-size: 12px; font-weight: bold; color: #2e7d32; }
        
        /* Fichas mejoradas */
        .ficha { width: 18px; height: 18px; border-radius: 50%; position: absolute; border: 2px solid white; box-shadow: 0 0 5px black; z-index: 10; }
        .ficha:nth-child(2) { top: 30px; left: 5px; }
        .ficha:nth-child(3) { top: 30px; right: 5px; }
        .ficha:nth-child(4) { bottom: 25px; left: 5px; }
        .ficha:nth-child(5) { bottom: 25px; right: 5px; }
.imagen-casilla { width: 35px; height: 35px; object-fit: contain; margin: 4px auto 0 auto; display: block; }
    </style>
</head>
<body>

    <div id="login" class="panel">
        <h1>Bienvenido a Monopoly</h1>
        <input type="text" id="nombreJugador" placeholder="Escribe tu nombre">
        <button onclick="entrarAlJuego()">Unirse a la partida</button>
    </div>

    <div id="juego" class="panel">
        <button onclick="tirar()">🎲 Tirar Dados</button>
        <div id="lista-jugadores"></div>
        <div id="tablero"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Base de datos de nuestras casillas (Aquí pones los nombres y los links de tus imágenes)
        const datosTablero = [
            { nombre: "SALIDA", precio: 0, color: "#ecf0f1", imagen: "https://cdn-icons-png.flaticon.com/512/1168/1168096.png" },
            { nombre: "Mi Tienda", precio: 60, color: "#8b4513", imagen: "https://cdn-icons-png.flaticon.com/512/1040/1040225.png" },
            { nombre: "Caja de Comunidad", precio: 0, color: "#ecf0f1", imagen: "https://cdn-icons-png.flaticon.com/512/1444/1444613.png" },
            { nombre: "Universidad Técnica de Manabí", precio: 60, color: "#8b4513", imagen: "https://cdn-icons-png.flaticon.com/512/2231/2231649.png" },
            { nombre: "Impuestos", precio: 200, color: "#ecf0f1", imagen: "https://cdn-icons-png.flaticon.com/512/3135/3135706.png" },
            { nombre: "Ferrocarril", precio: 200, color: "#bdc3c7", imagen: "https://cdn-icons-png.flaticon.com/512/2808/2808796.png" },
            { nombre: "Avenida Oriental", precio: 100, color: "#87ceeb", imagen: "https://cdn-icons-png.flaticon.com/512/2558/2558012.png" },
            { nombre: "Suerte", precio: 0, color: "#ecf0f1", imagen: "https://cdn-icons-png.flaticon.com/512/3074/3074528.png" }
        ];

        function crearTablero() {
            const tablero = document.getElementById('tablero');
            for(let i = 0; i < 40; i++) {
                // Si no has escrito las 40, pone un cuadro por defecto
                const info = datosTablero[i] || { nombre: "Propiedad " + i, precio: 150 + (i*10), color: "#f39c12", imagen: "" };
                
                const casilla = document.createElement('div');
                casilla.className = 'casilla';
                casilla.id = 'casilla-' + i;
                
                // Aquí le decimos al HTML que dibuje la imagen si es que existe en la lista
                const etiquetaImagen = info.imagen ? `<img src="${info.imagen}" class="imagen-casilla">` : '';

                casilla.innerHTML = `
                    <div class="color-bar" style="background-color: ${info.color};"></div>
                    ${etiquetaImagen}
                    <div class="nombre">${info.nombre}</div>
                    <div class="precio">${info.precio > 0 ? '$' + info.precio : ''}</div>
                `;
                tablero.appendChild(casilla);
            }
        }
        crearTablero();

        function entrarAlJuego() {
            const nombre = document.getElementById('nombreJugador').value;
            if (nombre.trim() === "") return alert("Escribe tu nombre");
            socket.emit('unirseAlJuego', nombre);
            document.getElementById('login').style.display = 'none';
            document.getElementById('juego').style.display = 'block';
        }

        function tirar() { socket.emit('tirarDado'); }

        socket.on('actualizarJugadores', (jugadores) => {
            const contenedor = document.getElementById('lista-jugadores');
            contenedor.innerHTML = ''; 
            document.querySelectorAll('.ficha').forEach(f => f.remove());

            for (let id in jugadores) {
                const j = jugadores[id];
                
                const div = document.createElement('div');
                div.className = 'jugador-card';
                div.style.backgroundColor = j.color;
                div.innerHTML = `👤 ${j.nombre} | 💰 $${j.dinero}`;
                contenedor.appendChild(div);

                const casillaDestino = document.getElementById('casilla-' + j.posicion);
                if(casillaDestino) {
                    const ficha = document.createElement('div');
                    ficha.className = 'ficha';
                    ficha.style.backgroundColor = j.color;
                    casillaDestino.appendChild(ficha);
                }
            }
        });
    </script>
</body>
</html>
