<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Fase 3</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e0f7fa; margin: 0; padding: 20px; text-align: center; }
        .panel { background: white; max-width: 800px; margin: 20px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #00796b; color: white; cursor: pointer; border: none; font-weight: bold; }
        
        #juego { display: none; }
        
        .jugador-card { display: inline-block; padding: 10px; margin: 5px; border-radius: 8px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black;}
        
        /* Estilos del nuevo tablero */
        #tablero { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 20px; gap: 5px; }
        .casilla { width: 60px; height: 60px; background: #eee; border: 2px solid #999; display: flex; align-items: center; justify-content: center; position: relative; font-weight: bold; color: #555; }
        .ficha { width: 15px; height: 15px; border-radius: 50%; position: absolute; border: 1px solid white; box-shadow: 0 0 3px black; }
        /* Posiciones para que las fichas no se encimen demasiado */
        .ficha:nth-child(1) { top: 5px; left: 5px; }
        .ficha:nth-child(2) { top: 5px; right: 5px; }
        .ficha:nth-child(3) { bottom: 5px; left: 5px; }
        .ficha:nth-child(4) { bottom: 5px; right: 5px; }
    </style>
</head>
<body>

    <div id="login" class="panel">
        <h1>Bienvenido a Monopoly</h1>
        <input type="text" id="nombreJugador" placeholder="Escribe tu nombre">
        <button onclick="entrarAlJuego()">Unirse a la partida</button>
    </div>

    <div id="juego" class="panel">
        <button onclick="tirar()">🎲 Tirar Dados</button>
        <div id="lista-jugadores"></div>
        
        <!-- Aquí se dibujará el tablero visualmente -->
        <div id="tablero"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Crear las 40 casillas al cargar la página
        function crearTablero() {
            const tablero = document.getElementById('tablero');
            for(let i = 0; i < 40; i++) {
                const casilla = document.createElement('div');
                casilla.className = 'casilla';
                casilla.id = 'casilla-' + i; // Le damos un ID único a cada casilla (ej. casilla-0)
                casilla.innerText = i; // Mostramos el número
                
                if(i === 0) casilla.innerText = "SALIDA";
                tablero.appendChild(casilla);
            }
        }
        crearTablero();

        function entrarAlJuego() {
            const nombre = document.getElementById('nombreJugador').value;
            if (nombre.trim() === "") return alert("Escribe tu nombre");
            socket.emit('unirseAlJuego', nombre);
            document.getElementById('login').style.display = 'none';
            document.getElementById('juego').style.display = 'block';
        }

        function tirar() { socket.emit('tirarDado'); }

        socket.on('actualizarJugadores', (jugadores) => {
            const contenedor = document.getElementById('lista-jugadores');
            contenedor.innerHTML = ''; 
            
            // 1. Limpiar todas las fichas del tablero antes de volver a dibujarlas
            document.querySelectorAll('.ficha').forEach(f => f.remove());

            // 2. Dibujar tarjetas y fichas nuevas
            for (let id in jugadores) {
                const j = jugadores[id];
                
                // Crear la tarjeta de estadísticas
                const div = document.createElement('div');
                div.className = 'jugador-card';
                div.style.backgroundColor = j.color;
                div.innerHTML = `👤 ${j.nombre} | 💰 $${j.dinero}`;
                contenedor.appendChild(div);

                // Crear la bolita (ficha) y ponerla en su casilla correspondiente
                const casillaDestino = document.getElementById('casilla-' + j.posicion);
                if(casillaDestino) {
                    const ficha = document.createElement('div');
                    ficha.className = 'ficha';
                    ficha.style.backgroundColor = j.color;
                    casillaDestino.appendChild(ficha);
                }
            }
        });
    </script>
</body>
</html>
