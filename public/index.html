<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly - Fase 7 (Cartas y Bote)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #e0f7fa; margin: 0; padding: 20px; text-align: center; }
        .panel { background: white; max-width: 900px; margin: 20px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #00796b; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        
        #juego { display: none; }
        .jugador-card { display: inline-block; padding: 10px; margin: 5px; border-radius: 8px; color: white; font-weight: bold; text-shadow: 1px 1px 2px black;}
        
        /* Tablero Circular */
        #tablero { 
            position: relative; 
            width: 850px; 
            height: 850px; 
            margin: 40px auto; 
            background: #1c2833; 
            border-radius: 50%; 
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        
        .casilla { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 52px; 
            height: 95px; 
            background: white; 
            border: 1px solid #7f8c8d; 
            display: flex; 
            flex-direction: column; 
            border-radius: 4px;
            overflow: hidden;
            transform-origin: center center; 
        }

        .color-bar { height: 20px; width: 100%; border-bottom: 2px solid #333; }
        
        .nombre { 
            padding: 2px; 
            font-size: 8.5px; 
            font-weight: bold; 
            flex-grow: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1.1; 
            text-align: center;
        }
        
        .precio { padding: 2px; font-size: 11px; font-weight: bold; color: #2e7d32; }
        .imagen-casilla { width: 25px; height: 25px; object-fit: contain; margin: 2px auto 0 auto; display: block; }
        
        /* Fichas */
        .ficha { width: 12px; height: 12px; border-radius: 50%; position: absolute; border: 1px solid white; box-shadow: 0 0 3px black; z-index: 10; transition: all 0.3s ease; }
        .ficha:nth-child(1) { top: 25px; left: 5px; }
        .ficha:nth-child(2) { top: 25px; right: 5px; }
        .ficha:nth-child(3) { bottom: 20px; left: 5px; }
        .ficha:nth-child(4) { bottom: 20px; right: 5px; }

        /* Pop-ups (Modales) */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 1000; text-align: center; width: 300px;
        }
        #modalCompra { border: 5px solid #2c3e50; }
        #modalCarta { border: 5px solid #2980b9; }
        #modalCanales { border: 5px solid #27ae60; }
    </style>
</head>
<body>

    <div id="login" class="panel">
        <h1>Bienvenido a Monopoly</h1>
        <input type="text" id="nombreJugador" placeholder="Escribe tu nombre">
        <button onclick="entrarAlJuego()">Unirse a la partida</button>
    </div>

    <div id="juego" class="panel">
        <h3 id="mensajeTurno" style="color: #2980b9; margin-top: 0;">Esperando jugadores...</h3>
        
        <!-- Botones de Acción -->
        <button id="btnFianza" onclick="pagarFianza()" style="background: #c0392b; display: none;">💸 Pagar Fianza ($50)</button>
        <button id="btnTirar" onclick="tirar()" style="display: none;">🎲 Tirar Dados</button>
        <button id="btnPasar" onclick="pasarTurno()" style="background: #e67e22; display: none;">⏭️ Terminar Turno</button>
        
        <div id="lista-jugadores"></div>
        <div id="tablero"></div>
    </div>

    <!-- 1. Ventanita de compra de propiedades -->
    <div id="modalCompra" class="modal">
        <h2 style="margin-top:0; color:#2c3e50;">🏡 ¡Propiedad Disponible!</h2>
        <p id="textoCompra" style="font-size:20px; font-weight:bold;"></p>
        <button id="btnComprar" style="background:#27ae60; font-size:18px; padding:10px 20px;">Comprar</button>
        <button onclick="document.getElementById('modalCompra').style.display='none'" style="background:#e74c3c; font-size:18px; padding:10px 20px;">Ignorar</button>
    </div>

    <!-- 2. Ventanita de Cofre CPN -->
    <div id="modalCarta" class="modal">
        <h2 style="margin-top:0; color:#2980b9;">💳 Cofre CPN</h2>
        <p id="textoCarta" style="font-size:18px; font-weight:bold;"></p>
        <button onclick="document.getElementById('modalCarta').style.display='none'" style="background: #3498db; font-size: 18px; padding: 10px 20px;">Aceptar</button>
    </div>

    <!-- 3. Ventanita de Canales de Atención -->
    <div id="modalCanales" class="modal">
        <h2 style="margin-top:0; color:#27ae60;">📱 Canales de Atención</h2>
        <p id="textoCartaCanales" style="font-size:18px; font-weight:bold;"></p>
        <button onclick="document.getElementById('modalCanales').style.display='none'" style="background: #2ecc71; font-size: 18px; padding: 10px 20px;">Aceptar</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // ---------------------------------------------------------
        // LISTA DE CASILLAS (Aquí pones los datos de tus propiedades)
        // ---------------------------------------------------------
        const datosTablero = [];
        for (let i = 0; i < 40; i++) {
            if (i === 0) datosTablero.push({ nombre: "SALIDA", precio: 0, color: "#ecf0f1", imagen: "" });
            else if (i === 10) datosTablero.push({ nombre: "Cárcel / Solo Visitas", precio: 0, color: "#ecf0f1", imagen: "" });
            else if (i === 20) datosTablero.push({ nombre: "Parada Libre", precio: 0, color: "#ecf0f1", imagen: "" });
            else if (i === 30) datosTablero.push({ nombre: "¡Ve a la Cárcel!", precio: 0, color: "#ecf0f1", imagen: "" });
            else if (i === 2 || i === 17 || i === 33) datosTablero.push({ nombre: "Cofre CPN", precio: 0, color: "#3498db", imagen: "" });
            else if (i === 7 || i === 22 || i === 36) datosTablero.push({ nombre: "Canales de Atención", precio: 0, color: "#2ecc71", imagen: "" });
            else {
                // TUS PROPIEDADES VAN AQUÍ (Reemplaza este bloque genérico con tus datos reales)
                datosTablero.push({ 
                    nombre: "Propiedad " + i, 
                    precio: 100 + (i*5), 
                    color: "#87ceeb", 
                    rentas: [10, 30, 90, 160, 250, 400], 
                    imagen: "" 
                });
            }
        }
        // ---------------------------------------------------------

        function crearTablero() {
            const tablero = document.getElementById('tablero');
            
            // Textos centrales y Bote acumulado
            tablero.innerHTML = `
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;">
                    <div style="color:white; font-size:32px; font-weight:bold; letter-spacing:2px; text-shadow: 0 0 10px rgba(255,255,255,0.3);">MONOPOLY</div>
                    <div id="textoBote" style="color:#f1c40f; font-size:24px; font-weight:bold; background:rgba(0,0,0,0.5); padding:5px 15px; border-radius:20px; border:2px solid #f1c40f; box-shadow: 0 0 15px rgba(241,196,15,0.4);">Bote: $0</div>
                </div>
            `;

            for(let i = 0; i < 40; i++) {
                const info = datosTablero[i];
                const casilla = document.createElement('div');
                casilla.className = 'casilla';
                casilla.id = 'casilla-' + i;
                
                const angulo = i * 9; 
                casilla.style.transform = `translate(-50%, -50%) rotate(${angulo}deg) translateY(-380px)`;

                const etiquetaImagen = info.imagen ? `<img src="${info.imagen}" class="imagen-casilla">` : '';

                casilla.innerHTML = `
                    <div class="color-bar" style="background-color: ${info.color};"></div>
                    ${etiquetaImagen}
                    <div class="nombre">${info.nombre}</div>
                    <div class="precio">${info.precio > 0 ? '$' + info.precio : ''}</div>
                `;
                
                tablero.appendChild(casilla);
            }
        }
        crearTablero();

        function entrarAlJuego() {
            const nombre = document.getElementById('nombreJugador').value;
            if (nombre.trim() === "") return alert("Escribe tu nombre");
            socket.emit('unirseAlJuego', nombre);
            document.getElementById('login').style.display = 'none';
            document.getElementById('juego').style.display = 'block';
        }

        // --- SISTEMA DE TURNOS Y JUGADORES ---
        let miTurno = false;
        let estoyEnCarcel = false;

        socket.on('alertaGlobal', (mensaje) => {
            alert(mensaje);
        });

        socket.on('actualizarJugadores', (jugadores) => {
            if (jugadores[socket.id]) {
                estoyEnCarcel = jugadores[socket.id].enCarcel;
            }
            
            const contenedor = document.getElementById('lista-jugadores');
            contenedor.innerHTML = ''; 
            document.querySelectorAll('.ficha').forEach(f => f.remove());

            for (let id in jugadores) {
                const j = jugadores[id];
                const div = document.createElement('div');
                div.className = 'jugador-card';
                div.style.backgroundColor = j.color;
                div.innerHTML = `👤 ${j.nombre} | 💰 $${j.dinero}`;
                contenedor.appendChild(div);

                const casillaDestino = document.getElementById('casilla-' + j.posicion);
                if(casillaDestino) {
                    const ficha = document.createElement('div');
                    ficha.className = 'ficha';
                    ficha.style.backgroundColor = j.color;
                    casillaDestino.appendChild(ficha);
                }
            }
        });

        socket.on('actualizarTurno', (idTurno) => {
            miTurno = (socket.id === idTurno);
            
            const btnTirar = document.getElementById('btnTirar');
            const btnPasar = document.getElementById('btnPasar');
            const btnFianza = document.getElementById('btnFianza');
            const mensaje = document.getElementById('mensajeTurno');

            if (miTurno) {
                mensaje.innerText = "¡Es tu turno!";
                btnTirar.style.display = 'inline-block';
                btnTirar.disabled = false;
                btnTirar.style.opacity = '1';
                btnPasar.style.display = 'inline-block';
                
                if (estoyEnCarcel) btnFianza.style.display = 'inline-block';
                else btnFianza.style.display = 'none';
            } else {
                mensaje.innerText = "Turno de otro jugador...";
                btnTirar.style.display = 'none';
                btnPasar.style.display = 'none';
                btnFianza.style.display = 'none';
            }
        });

        // Actualizar el numerito del bote en el centro del tablero
        socket.on('actualizarBote', (monto) => {
            const textoBote = document.getElementById('textoBote');
            if(textoBote) textoBote.innerText = `Bote: $${monto}`;
        });

        function pagarFianza() {
            if(miTurno && estoyEnCarcel) {
                socket.emit('pagarFianza');
                document.getElementById('btnFianza').style.display = 'none';
            }
        }

        function tirar() { 
            if(miTurno) {
                socket.emit('tirarDado'); 
                document.getElementById('btnTirar').disabled = true;
                document.getElementById('btnTirar').style.opacity = '0.5';
                document.getElementById('btnFianza').style.display = 'none';
            }
        }

        function pasarTurno() {
            if(miTurno) socket.emit('terminarTurno');
        }

        // --- VENTANAS DE CARTAS ---
        socket.on('mostrarCartaCPN', (datos) => {
            document.getElementById('textoCarta').innerText = `👤 ${datos.jugador} sacó la siguiente carta:\n\n"${datos.carta}"`;
            document.getElementById('modalCarta').style.display = 'block';
        });

        socket.on('mostrarCartaCanales', (datos) => {
            document.getElementById('textoCartaCanales').innerText = `👤 ${datos.jugador} sacó la siguiente carta:\n\n"${datos.carta}"`;
            document.getElementById('modalCanales').style.display = 'block';
        });

        // --- COMPRAS Y ALQUILERES ---
        socket.on('preguntarCompra', (casillaIndex) => {
            const info = datosTablero[casillaIndex];
            if (!info || !info.precio || info.precio === 0) return;

            document.getElementById('textoCompra').innerText = `¿Quieres comprar ${info.nombre} por $${info.precio}?`;
            document.getElementById('modalCompra').style.display = 'block';
            
            document.getElementById('btnComprar').onclick = function() {
                socket.emit('comprarPropiedad', { 
                    casilla: casillaIndex, 
                    precio: info.precio,
                    rentas: info.rentas || [10, 20, 50, 100, 150, 200] 
                });
                document.getElementById('modalCompra').style.display = 'none'; 
            };
        });

        socket.on('preguntarConstruccion', (casillaIndex) => {
            const info = datosTablero[casillaIndex];
            const costo = Math.floor(info.precio * 0.5);
            
            if (confirm(`¡Caíste de nuevo en ${info.nombre}!\n¿Quieres construir una casa/hotel por $${costo}?`)) {
                socket.emit('comprarCasa', casillaIndex);
            }
        });

        socket.on('actualizarPropiedades', (propiedades) => {
            document.querySelectorAll('.casilla').forEach(c => {
                c.style.boxShadow = 'none';
                c.querySelectorAll('.icono-casa').forEach(v => v.remove()); 
            });
            
            for (let casillaIndex in propiedades) {
                const casillaHTML = document.getElementById('casilla-' + casillaIndex);
                if (casillaHTML) {
                    const prop = propiedades[casillaIndex];
                    casillaHTML.style.boxShadow = `inset 0 0 0 6px ${prop.colorDueno}`;
                    
                    let iconos = '';
                    if (prop.hotel) iconos = '🏨';
                    else for (let i = 0; i < prop.casas; i++) iconos += '🏠';
                    
                    if (iconos !== '') {
                        const div = document.createElement('div');
                        div.className = 'icono-casa';
                        div.style = 'position:absolute; top:2px; right:2px; font-size:10px; background:rgba(255,255,255,0.8); border-radius:3px; padding:1px; z-index:20;';
                        div.innerText = iconos;
                        casillaHTML.appendChild(div);
                    }
                }
            }
        });

        socket.on('pagoAlquiler', (datos) => {
            alert(`💸 ¡Caja registradora! ${datos.pagador} pagó $${datos.monto} de alquiler a ${datos.cobrador}`);
        });
    </script>
</body>
</html>
